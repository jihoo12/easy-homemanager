[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-homemanager"
description = "A semi-automatic CLI for Home Manager: packages, program options and dotfiles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dynamic = ["version"]
dependencies = []

[project.scripts]
ehm = "ehm.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ehm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
